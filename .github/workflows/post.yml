name: 自动发帖
on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时（UTC时间的0,6,12,18点）自动触发，无缝续命
  workflow_dispatch:          # 保留手动触发，方便你第一次启动

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install pyTelegramBotAPI
      - name: 运行发送脚本
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
        run: python sender.py   # 这里用你那个带 while True 的脚本
